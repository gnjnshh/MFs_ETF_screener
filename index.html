<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mutual & Index Fund Screener</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .return-pos { color: #10b981; font-weight: 600; }
    .return-neg { color: #ef4444; font-weight: 600; }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased min-h-screen p-3 sm:p-6 pb-24">

  <!-- Header -->
  <header class="mb-4">
    <div class="flex items-center justify-between gap-2">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-[var(--foreground)] flex items-center gap-2">
          <span>📊</span> Fund Screener
        </h1>
        <p class="text-xs sm:text-sm text-[var(--muted-foreground)]">165+ Schemes • Returns & AUM Analysis</p>
      </div>
      <div class="text-right">
        <span id="scheme-count-badge" class="inline-block px-2.5 py-1 text-xs font-semibold rounded-full bg-[var(--card)] border border-[var(--border)] text-[var(--foreground)]">
          165 Funds
        </span>
      </div>
    </div>
  </header>

  <!-- Search & Primary Filters -->
  <section class="space-y-3 mb-4">
    <!-- Search Bar -->
    <div class="relative">
      <input type="text" id="search-input" placeholder="🔍 Search fund or AMC (e.g. SBI, Parag, Nifty)..." 
        class="w-full px-4 py-2.5 text-sm rounded-xl bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] focus:outline-none focus:ring-2 focus:ring-[var(--primary)] placeholder:text-[var(--placeholder)]" />
      <button id="clear-search" class="hidden absolute right-3 top-2.5 text-xs text-[var(--muted-foreground)] hover:text-[var(--foreground)]">✕</button>
    </div>

    <!-- Category Pills (Horizontal Scrollable) -->
    <div class="flex gap-2 overflow-x-auto no-scrollbar py-1 text-xs" id="category-pills">
      <button class="cat-pill px-3 py-1.5 rounded-full whitespace-nowrap font-medium transition-all bg-[var(--foreground)] text-[var(--background)] active" data-cat="ALL">All</button>
      <button class="cat-pill px-3 py-1.5 rounded-full whitespace-nowrap font-medium transition-all bg-[var(--card)] border border-[var(--border)] text-[var(--muted-foreground)]" data-cat="Large Cap">Large Cap</button>
      <button class="cat-pill px-3 py-1.5 rounded-full whitespace-nowrap font-medium transition-all bg-[var(--card)] border border-[var(--border)] text-[var(--muted-foreground)]" data-cat="Mid Cap">Mid Cap</button>
      <button class="cat-pill px-3 py-1.5 rounded-full whitespace-nowrap font-medium transition-all bg-[var(--card)] border border-[var(--border)] text-[var(--muted-foreground)]" data-cat="Small Cap">Small Cap</button>
      <button class="cat-pill px-3 py-1.5 rounded-full whitespace-nowrap font-medium transition-all bg-[var(--card)] border border-[var(--border)] text-[var(--muted-foreground)]" data-cat="Flexi Cap">Flexi Cap</button>
      <button class="cat-pill px-3 py-1.5 rounded-full whitespace-nowrap font-medium transition-all bg-[var(--card)] border border-[var(--border)] text-[var(--muted-foreground)]" data-cat="Index Fund">Index Fund</button>
      <button class="cat-pill px-3 py-1.5 rounded-full whitespace-nowrap font-medium transition-all bg-[var(--card)] border border-[var(--border)] text-[var(--muted-foreground)]" data-cat="EV / New Age">⚡ EV & New Age</button>
      <button class="cat-pill px-3 py-1.5 rounded-full whitespace-nowrap font-medium transition-all bg-[var(--card)] border border-[var(--border)] text-[var(--muted-foreground)]" data-cat="Gold / Silver ETF">🥇 Gold & Silver</button>
      <button class="cat-pill px-3 py-1.5 rounded-full whitespace-nowrap font-medium transition-all bg-[var(--card)] border border-[var(--border)] text-[var(--muted-foreground)]" data-cat="Sectoral / Thematic">Sectoral</button>
      <button class="cat-pill px-3 py-1.5 rounded-full whitespace-nowrap font-medium transition-all bg-[var(--card)] border border-[var(--border)] text-[var(--muted-foreground)]" data-cat="ELSS Tax Saver">ELSS</button>
    </div>

    <!-- Quick Sort & Type Dropdowns -->
    <div class="grid grid-cols-2 gap-2 text-xs">
      <div>
        <label class="text-[var(--muted-foreground)] block mb-1 font-medium">Sort By</label>
        <select id="sort-select" class="w-full px-2.5 py-2 rounded-lg bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] focus:outline-none focus:ring-1 focus:ring-[var(--primary)]">
          <option value="aum-desc">AUM: High to Low</option>
          <option value="ret5y-desc">5Y Return: High to Low</option>
          <option value="ret3y-desc">3Y Return: High to Low</option>
          <option value="ret1y-desc">1Y Return: High to Low</option>
          <option value="ret6m-desc">6M Return: High to Low</option>
          <option value="ret1m-desc">1M Return: High to Low</option>
          <option value="name-asc">Name: A to Z</option>
        </select>
      </div>
      <div>
        <label class="text-[var(--muted-foreground)] block mb-1 font-medium">Fund Type</label>
        <select id="type-select" class="w-full px-2.5 py-2 rounded-lg bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] focus:outline-none focus:ring-1 focus:ring-[var(--primary)]">
          <option value="ALL">All Types</option>
          <option value="Active Equity">Active Equity</option>
          <option value="Index Fund">Index Fund</option>
          <option value="ETF">ETF</option>
          <option value="Debt / Liquid">Debt / Liquid</option>
          <option value="Hybrid">Hybrid</option>
        </select>
      </div>
    </div>
  </section>

  <!-- Schemes List Container -->
  <main id="schemes-list" class="space-y-3">
    <!-- Cards rendered dynamically via JS -->
  </main>

  <!-- Empty state -->
  <div id="empty-state" class="hidden py-12 text-center text-[var(--muted-foreground)]">
    <div class="text-3xl mb-2">🔍</div>
    <div class="text-sm font-semibold">No matching funds found</div>
    <div class="text-xs mt-1">Try adjusting your search terms or filters</div>
  </div>

  <!-- Compare Floating Sheet (when >= 2 selected) -->
  <div id="compare-bar" class="hidden fixed bottom-3 left-3 right-3 sm:left-auto sm:right-6 sm:w-96 bg-[var(--card)] border border-[var(--border)] shadow-xl rounded-2xl p-3 z-50 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="text-xs font-bold px-2 py-1 bg-[var(--foreground)] text-[var(--background)] rounded-full" id="compare-count">2</span>
      <span class="text-xs font-medium text-[var(--foreground)]">Funds selected</span>
    </div>
    <div class="flex gap-2">
      <button id="clear-compare-btn" class="px-2.5 py-1 text-xs text-[var(--muted-foreground)] hover:text-[var(--foreground)]">Clear</button>
      <button id="open-compare-btn" class="px-3 py-1.5 text-xs font-semibold bg-[var(--foreground)] text-[var(--background)] rounded-lg hover:opacity-90">Compare Side-by-Side</button>
    </div>
  </div>

  <!-- Comparison Modal -->
  <div id="compare-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-[var(--card)] text-[var(--foreground)] w-full max-w-2xl max-h-[90vh] rounded-t-2xl sm:rounded-2xl border border-[var(--border)] overflow-hidden flex flex-col">
      <div class="p-4 border-b border-[var(--border)] flex items-center justify-between">
        <h3 class="font-bold text-base flex items-center gap-2">⚖️ Fund Comparison</h3>
        <button id="close-compare-modal" class="text-lg text-[var(--muted-foreground)] hover:text-[var(--foreground)] p-1">✕</button>
      </div>
      <div class="p-4 overflow-y-auto space-y-4" id="compare-modal-content">
        <!-- Dynamic comparison table -->
      </div>
    </div>
  </div>

 Bond ETF - April 2030 (EBBETF0430)", "AMC": "Edelweiss Mutual Fund", "Category": "Debt ETF", "Fund Type": "ETF", "AUM (Cr)": 18500, "1M (%)": 0.65, "3M (%)": 1.95, "6M (%)": 4.1, "1Y (%)": 7.8, "3Y (%)": 7.65, "5Y (%)": 7.4, "Benchmark": "Nifty BHARAT Bond Index - April 2030", "Expense Ratio (%)": 0.0005, "Risk Rating": "Moderate"}];

    let currentCategory = 'ALL';
    let currentType = 'ALL';
    let currentSearch = '';
    let currentSort = 'aum-desc';
    const selectedForCompare = new Set();

    const searchInput = document.getElementById('search-input');
    const clearSearchBtn = document.getElementById('clear-search');
    const sortSelect = document.getElementById('sort-select');
    const typeSelect = document.getElementById('type-select');
    const schemesList = document.getElementById('schemes-list');
    const emptyState = document.getElementById('empty-state');
    const schemeCountBadge = document.getElementById('scheme-count-badge');
    const compareBar = document.getElementById('compare-bar');
    const compareCount = document.getElementById('compare-count');
    const compareModal = document.getElementById('compare-modal');

    // Category pill listeners
    document.querySelectorAll('.cat-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.cat-pill').forEach(p => {
          p.className = 'cat-pill px-3 py-1.5 rounded-full whitespace-nowrap font-medium transition-all bg-[var(--card)] border border-[var(--border)] text-[var(--muted-foreground)]';
        });
        pill.className = 'cat-pill px-3 py-1.5 rounded-full whitespace-nowrap font-medium transition-all bg-[var(--foreground)] text-[var(--background)] active';
        currentCategory = pill.dataset.cat;
        renderSchemes();
      });
    });

    searchInput.addEventListener('input', (e) => {
      currentSearch = e.target.value.trim().toLowerCase();
      clearSearchBtn.classList.toggle('hidden', currentSearch.length === 0);
      renderSchemes();
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      currentSearch = '';
      clearSearchBtn.classList.add('hidden');
      renderSchemes();
    });

    sortSelect.addEventListener('change', (e) => {
      currentSort = e.target.value;
      renderSchemes();
    });

    typeSelect.addEventListener('change', (e) => {
      currentType = e.target.value;
      renderSchemes();
    });

    function formatVal(v) {
      if (v === null || v === undefined || isNaN(v)) return '--';
      const num = Number(v);
      const cls = num >= 0 ? 'return-pos' : 'return-neg';
      return `<span class="${cls}">${num >= 0 ? '+' : ''}${num.toFixed(1)}%</span>`;
    }

    function renderSchemes() {
      let filtered = fundsData.filter(item => {
        if (currentCategory !== 'ALL' && item.Category !== currentCategory) return false;
        if (currentType !== 'ALL' && item['Fund Type'] !== currentType) return false;
        if (currentSearch) {
          const name = (item['Scheme Name'] || '').toLowerCase();
          const amc = (item['AMC'] || '').toLowerCase();
          const cat = (item['Category'] || '').toLowerCase();
          if (!name.includes(currentSearch) && !amc.includes(currentSearch) && !cat.includes(currentSearch)) {
            return false;
          }
        }
        return true;
      });

      filtered.sort((a, b) => {
        const aumA = Number(a['AUM (Cr)']) || 0;
        const aumB = Number(b['AUM (Cr)']) || 0;
        const ret5A = a['5Y (%)'] !== null ? Number(a['5Y (%)']) : -999;
        const ret5B = b['5Y (%)'] !== null ? Number(b['5Y (%)']) : -999;
        const ret3A = a['3Y (%)'] !== null ? Number(a['3Y (%)']) : -999;
        const ret3B = b['3Y (%)'] !== null ? Number(b['3Y (%)']) : -999;
        const ret1A = a['1Y (%)'] !== null ? Number(a['1Y (%)']) : -999;
        const ret1B = b['1Y (%)'] !== null ? Number(b['1Y (%)']) : -999;
        const ret6mA = a['6M (%)'] !== null ? Number(a['6M (%)']) : -999;
        const ret6mB = b['6M (%)'] !== null ? Number(b['6M (%)']) : -999;
        const ret1mA = a['1M (%)'] !== null ? Number(a['1M (%)']) : -999;
        const ret1mB = b['1M (%)'] !== null ? Number(b['1M (%)']) : -999;

        switch (currentSort) {
          case 'aum-desc': return aumB - aumA;
          case 'ret5y-desc': return ret5B - ret5A;
          case 'ret3y-desc': return ret3B - ret3A;
          case 'ret1y-desc': return ret1B - ret1A;
          case 'ret6m-desc': return ret6mB - ret6mA;
          case 'ret1m-desc': return ret1mB - ret1mA;
          case 'name-asc': return (a['Scheme Name'] || '').localeCompare(b['Scheme Name'] || '');
          default: return aumB - aumA;
        }
      });

      schemeCountBadge.textContent = `${filtered.length} Funds`;

      if (filtered.length === 0) {
        schemesList.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      schemesList.innerHTML = filtered.map(fund => {
        const isChecked = selectedForCompare.has(fund['Scheme Name']) ? 'checked' : '';
        const aumStr = (Number(fund['AUM (Cr)']) || 0).toLocaleString('en-IN');
        const safeName = fund['Scheme Name'].replace(/'/g, "\\'");
        return `
        <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-3.5 sm:p-4 shadow-sm transition hover:border-[var(--foreground)]/40">
          <div class="flex items-start justify-between gap-2 mb-2">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-[var(--foreground)]/10 text-[var(--foreground)]">${fund.Category}</span>
              <span class="px-2 py-0.5 rounded-md text-[11px] font-medium bg-[var(--border)] text-[var(--muted-foreground)]">${fund['Fund Type']}</span>
              <span class="text-[11px] text-[var(--muted-foreground)]">${fund.AMC}</span>
            </div>
            <label class="flex items-center gap-1 text-[11px] font-medium text-[var(--muted-foreground)] cursor-pointer select-none shrink-0">
              <input type="checkbox" class="compare-cb rounded border-[var(--border)]" data-scheme="${fund['Scheme Name']}" ${isChecked} onchange="toggleCompare('${safeName}')">
              <span>Compare</span>
            </label>
          </div>

          <h2 class="font-bold text-sm sm:text-base text-[var(--foreground)] mb-2.5 leading-snug">${fund['Scheme Name']}</h2>

          <div class="grid grid-cols-4 gap-2 text-center p-2 rounded-lg bg-[var(--background)]/60 border border-[var(--border)] mb-2.5">
            <div>
              <div class="text-[10px] text-[var(--muted-foreground)] uppercase">AUM</div>
              <div class="text-xs font-bold text-[var(--foreground)] mt-0.5">₹${aumStr} Cr</div>
            </div>
            <div>
              <div class="text-[10px] text-[var(--muted-foreground)] uppercase">1Y Return</div>
              <div class="text-xs mt-0.5">${formatVal(fund['1Y (%)'])}</div>
            </div>
            <div>
              <div class="text-[10px] text-[var(--muted-foreground)] uppercase">3Y Return</div>
              <div class="text-xs mt-0.5">${formatVal(fund['3Y (%)'])}</div>
            </div>
            <div>
              <div class="text-[10px] text-[var(--muted-foreground)] uppercase">5Y Return</div>
              <div class="text-xs mt-0.5">${formatVal(fund['5Y (%)'])}</div>
            </div>
          </div>

          <details class="text-xs text-[var(--muted-foreground)] mt-2 pt-2 border-t border-[var(--border)]/50">
            <summary class="cursor-pointer text-[11px] font-medium text-[var(--foreground)] hover:underline">More Scheme Details ▾</summary>
            <div class="mt-2 space-y-1 text-[11px]">
              <div class="flex justify-between"><span>1 Month:</span> <span>${formatVal(fund['1M (%)'])}</span></div>
              <div class="flex justify-between"><span>6 Month:</span> <span>${formatVal(fund['6M (%)'])}</span></div>
              <div class="flex justify-between"><span>Benchmark:</span> <span class="text-[var(--foreground)] font-medium text-right">${fund.Benchmark || 'N/A'}</span></div>
              <div class="flex justify-between"><span>Expense Ratio:</span> <span class="text-[var(--foreground)] font-medium">${fund['Expense Ratio (%)']}%</span></div>
              <div class="flex justify-between"><span>Risk Rating:</span> <span class="text-[var(--foreground)] font-medium">${fund['Risk Rating']}</span></div>
            </div>
          </details>
        </div>
        `;
      }).join('');
    }

    window.toggleCompare = function(schemeName) {
      if (selectedForCompare.has(schemeName)) {
        selectedForCompare.delete(schemeName);
      } else {
        if (selectedForCompare.size >= 4) {
          alert('You can compare at most 4 schemes at a time.');
          renderSchemes();
          return;
        }
        selectedForCompare.add(schemeName);
      }
      updateCompareBar();
    };

    function updateCompareBar() {
      const count = selectedForCompare.size;
      compareCount.textContent = count;
      compareBar.classList.toggle('hidden', count === 0);
    }

    document.getElementById('clear-compare-btn').addEventListener('click', () => {
      selectedForCompare.clear();
      updateCompareBar();
      renderSchemes();
    });

    document.getElementById('open-compare-btn').addEventListener('click', () => {
      const schemes = Array.from(selectedForCompare).map(name => fundsData.find(f => f['Scheme Name'] === name)).filter(Boolean);
      if (schemes.length === 0) return;

      const modalContent = document.getElementById('compare-modal-content');
      modalContent.innerHTML = `
        <div class="overflow-x-auto">
          <table class="w-full text-xs text-left">
            <thead>
              <tr class="border-b border-[var(--border)]">
                <th class="p-2 text-[var(--muted-foreground)] font-medium">Metric</th>
                ${schemes.map(s => `<th class="p-2 font-bold text-[var(--foreground)] min-w-[140px]">${s['Scheme Name']}</th>`).join('')}
              </tr>
            </thead>
            <tbody class="divide-y divide-[var(--border)]">
              <tr>
                <td class="p-2 text-[var(--muted-foreground)] font-medium">Category</td>
                ${schemes.map(s => `<td class="p-2 font-semibold">${s.Category}</td>`).join('')}
              </tr>
              <tr>
                <td class="p-2 text-[var(--muted-foreground)] font-medium">AUM (Cr)</td>
                ${schemes.map(s => `<td class="p-2 font-bold">₹${(Number(s['AUM (Cr)']) || 0).toLocaleString('en-IN')} Cr</td>`).join('')}
              </tr>
              <tr>
                <td class="p-2 text-[var(--muted-foreground)] font-medium">1M Return</td>
                ${schemes.map(s => `<td class="p-2">${formatVal(s['1M (%)'])}</td>`).join('')}
              </tr>
              <tr>
                <td class="p-2 text-[var(--muted-foreground)] font-medium">6M Return</td>
                ${schemes.map(s => `<td class="p-2">${formatVal(s['6M (%)'])}</td>`).join('')}
              </tr>
              <tr>
                <td class="p-2 text-[var(--muted-foreground)] font-medium">1Y Return</td>
                ${schemes.map(s => `<td class="p-2 font-bold">${formatVal(s['1Y (%)'])}</td>`).join('')}
              </tr>
              <tr>
                <td class="p-2 text-[var(--muted-foreground)] font-medium">3Y Return</td>
                ${schemes.map(s => `<td class="p-2 font-bold">${formatVal(s['3Y (%)'])}</td>`).join('')}
              </tr>
              <tr>
                <td class="p-2 text-[var(--muted-foreground)] font-medium">5Y Return</td>
                ${schemes.map(s => `<td class="p-2 font-bold">${formatVal(s['5Y (%)'])}</td>`).join('')}
              </tr>
              <tr>
                <td class="p-2 text-[var(--muted-foreground)] font-medium">Expense Ratio</td>
                ${schemes.map(s => `<td class="p-2 font-medium">${s['Expense Ratio (%)']}%</td>`).join('')}
              </tr>
              <tr>
                <td class="p-2 text-[var(--muted-foreground)] font-medium">Benchmark</td>
                ${schemes.map(s => `<td class="p-2 text-[var(--muted-foreground)]">${s.Benchmark || 'N/A'}</td>`).join('')}
              </tr>
            </tbody>
          </table>
        </div>
      `;
      compareModal.classList.remove('hidden');
    });

    document.getElementById('close-compare-modal').addEventListener('click', () => {
      compareModal.classList.add('hidden');
    });

    // Initial render
    renderSchemes();
  </script>
</body>
</html>
